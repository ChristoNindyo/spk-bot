name: SPK alert

on:
  schedule:
    # GitHub uses UTC (WIB = UTC + 7).
    # "*/30 0-10 * * *" = every 30 minutes from 07:00 to 17:30 WIB, every day
    - cron: "15,45 0-17 * * *"
  workflow_dispatch:   # adds a "Run workflow" button for manual runs / tests
    inputs:
      mode:
        description: "alert = normal check, test = send a test message"
        type: choice
        options:
          - alert
          - test
        default: alert

permissions:
  contents: write      # needed to save the "already alerted" list

concurrency:
  group: spk-alert     # never run two checks at the same time
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Get saved state (branch bot-state)
        uses: actions/checkout@v4
        with:
          ref: bot-state
          path: state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install pandas sqlalchemy pymysql requests openpyxl

      - name: Run bot
        run: python spk_bot.py ${{ github.event.inputs.mode || 'alert' }}
        env:
          STATE_FILE: state/notified.json
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save state
        run: |
          cd state
          git config user.name "spk-bot"
          git config user.email "spk-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "update state"
            git push
          fi
